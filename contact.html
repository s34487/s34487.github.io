<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ติดต่อ | My Chinese Portfolio</title>

    <style>

        /* ===== พื้นฐาน ===== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #700000, #3b0000);
            color: #f5d77a;
        }


        /* ===== แถบเมนู ===== */

        nav {
            height: 100px;
            background: #650000;
            border-bottom: 2px solid #d6a928;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 18px;

            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo .dragon {
            font-size: 48px;
        }

        .menu {
            display: flex;
            gap: 38px;
        }

        .menu div {
            color: #f5d77a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .menu div:hover {
            color: white;
        }


        /* ===== หัวข้อ ===== */

        .header {
            text-align: center;
            padding-top: 35px;
        }

        .chinese-title {
            font-size: 28px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
        }

        .description {
            color: white;
            font-size: 18px;
            margin-top: 40px;
        }


        /* ===== กล่องทั้งหมด ===== */

        .contact-container {
            width: 72%;
            max-width: 1100px;

            margin: 65px auto;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }


        /* ===== กล่องซ้าย ===== */

        .left-box {
            border: 2px solid #d6a928;
            background: rgba(90, 0, 0, 0.65);

            min-height: 540px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* ===== กล่องขวา ===== */

        .right-box {
            border: 2px solid #d6a928;
            background: rgba(90, 0, 0, 0.65);

            min-height: 540px;

            display: grid;
            grid-template-rows: 1fr 1fr;
        }


        .social {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .social:first-child {
            border-bottom: 2px solid #d6a928;
        }


        /* ===== ไอคอน ===== */

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .facebook-icon {
            font-family: Arial, sans-serif;
            font-size: 58px;
            font-weight: bold;
        }

        .instagram-icon {
            font-size: 60px;
        }


        /* ===== หัวข้อ Email / Facebook / Instagram ===== */

        .contact-title {
            color: #f5d77a;

            font-size: 30px;
            font-weight: bold;

            margin-bottom: 15px;
        }


        /* ===== ข้อมูล ===== */

        .contact-detail {
            color: white;

            font-size: 20px;

            margin-top: 5px;
        }


        /* ===== เส้นด้านล่าง ===== */

        .bottom-line {
            width: 60%;
            height: 2px;

            background: #d6a928;

            margin: 60px auto;
        }


        /* ===== มือถือ / iPad จอเล็ก ===== */

        @media (max-width: 800px) {

            nav {
                height: auto;
                padding: 20px;

                flex-direction: column;
                gap: 20px;
            }

            .menu {
                gap: 15px;

                flex-wrap: wrap;
                justify-content: center;
            }

            .menu div {
                font-size: 15px;
            }

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 15px;

                padding: 0 20px;
            }

            .contact-container {
                width: 90%;

                grid-template-columns: 1fr;

                margin-top: 40px;
            }

            .left-box,
            .right-box {
                min-height: 420px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         เมนูด้านบน
    ========================== -->

    <nav>

        <div class="logo">

            <div class="dragon">
                龍
            </div>

            <div>
                MY PORTFOLIO
            </div>

        </div>


        <div class="menu">

            <div>หน้าหลัก</div>

            <div>เกี่ยวกับฉัน</div>

            <div>ผลงาน</div>

            <div>เกียรติบัตร</div>

            <div>ติดต่อ</div>

        </div>

    </nav>



    <!-- =========================
         หัวข้อ
    ========================== -->

    <div class="header">

        <div class="chinese-title">
            联 系 我
        </div>

        <h1>
            ติดต่อฉัน
        </h1>

        <div class="description">
            หากต้องการติดต่อ สอบถาม หรือพูดคุย
            สามารถติดต่อฉันได้ตามช่องทางด้านล่าง
        </div>

    </div>



    <!-- =========================
         กล่องติดต่อ
    ========================== -->

    <div class="contact-container">


        <!-- ===== กล่องซ้าย ===== -->

        <div class="left-box">


            <!-- Email -->

            <div class="icon">
                ✉️
            </div>

            <div class="contact-title">
                Email
            </div>

            <div class="contact-detail">
                samattakachayanit@gmail.com
            </div>



            <!-- โทรศัพท์ -->

            <div
                class="icon"
                style="margin-top: 35px;"
            >
                ☎️
            </div>

            <div class="contact-title">
                โทรศัพท์
            </div>

            <div class="contact-detail">
                082-213-7716
            </div>


        </div>



        <!-- ===== กล่องขวา ===== -->

        <div class="right-box">


            <!-- Facebook -->

            <div class="social">

                <div class="facebook-icon">
                    f
                </div>

                <div class="contact-title">
                    Facebook
                </div>

                <div class="contact-detail">
                    -
                </div>

            </div>



            <!-- Instagram -->

            <div class="social">

                <div class="instagram-icon">
                    ◎
                </div>

                <div class="contact-title">
                    Instagram
                </div>

                <div class="contact-detail">
                    _2pxtcnst
                </div>

            </div>


        </div>

    </div>



    <!-- เส้นด้านล่าง -->

    <div class="bottom-line"></div>


</body>

</html>
